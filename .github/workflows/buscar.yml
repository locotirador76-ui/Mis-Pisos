name: Buscar pisos
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scraper.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
          IDEALISTA_KEY: ${{ secrets.IDEALISTA_KEY }}
          IDEALISTA_SECRET: ${{ secrets.IDEALISTA_SECRET }}
      - run: |
          git config user.name "buscador"
          git config user.email "buscador@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Actualizar anuncios" && git push)
