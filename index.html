<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Pisos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#12353a;--mute:#5d7478;--line:#d5e0e2;--mar:#0e6f78;--sol:#e0a21b;--rojo:#b3352b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b1d;--card:#172a2d;--ink:#e6f0f1;--mute:#93aeb2;--line:#27434a;--mar:#4cc0cb;--sol:#f0b838;--rojo:#ef7b70}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:960px;margin:auto}h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:.9rem}
.bar{max-width:960px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--mar);outline-offset:2px}
button.on{background:var(--mar);color:#fff;border-color:var(--mar)}
main{max-width:960px;margin:auto;padding:8px 16px 40px;display:grid;gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.p{font-size:1.35rem;font-weight:700}.t{color:var(--mute);font-size:.92rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.nuevo{border-color:var(--mar);color:var(--mar)}.baja{border-color:var(--sol);color:var(--sol)}.riesgo{border-color:var(--rojo);color:var(--rojo)}
.act{display:flex;gap:8px;flex-wrap:wrap}.act a{color:var(--mar);font-weight:600}
#mapa{height:420px;border-radius:10px;border:1px solid var(--line);display:none}
.vacio{padding:30px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header><h1>Mis Pisos</h1><div class="sub" id="sub">Cargando…</div></header>
<div class="bar">
 <button data-v="todos" class="on">Todos</button><button data-v="fav">Favoritos</button><button data-v="desc">Descartados</button><button data-v="mapa">Mapa</button>
 <select id="zona" aria-label="Zona"><option value="">Todas las zonas</option></select>
 <select id="orden" aria-label="Orden"><option value="nuevo">Más recientes</option><option value="precio">Precio más bajo</option></select>
 <label><input type="checkbox" id="rg"> Mostrar con riesgo</label>
</div>
<main><div id="mapa"></div><div id="lista"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
let A=[],vista="todos",map,capa,S={fav:[],desc:[]};
try{S=JSON.parse(localStorage.getItem("pisos")||"")||S}catch(e){}
const guarda=()=>{try{localStorage.setItem("pisos",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const eur=n=>n?Math.round(n).toLocaleString("es-ES")+" €":"precio sin indicar";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tags(a){const t=[],h=a.historial||[];
 if((Date.now()-new Date(a.primera_vez))/864e5<=2)t.push('<span class="tag nuevo">Nuevo</span>');
 if(h.length>1&&h.at(-1)[1]<h[0][1])t.push(`<span class="tag baja">Bajó de ${eur(h[0][1])}</span>`);
 if(a.riesgo)t.push(`<span class="tag riesgo">Riesgo: «${esc(a.riesgo)}»</span>`);
 if(a.incompleto)t.push('<span class="tag">Datos incompletos: revisa el anuncio</span>');
 return t.join("")}
function filtra(){let l=A.filter(a=>{const f=S.fav.includes(a.id),d=S.desc.includes(a.id);
 if(vista==="fav")return f;if(vista==="desc")return d;if(d)return false;
 if(a.riesgo&&!$("rg").checked)return false;return !$("zona").value||a.zona===$("zona").value});
 return l.sort($("orden").value==="precio"?(x,y)=>(x.precio||9e9)-(y.precio||9e9):(x,y)=>y.primera_vez.localeCompare(x.primera_vez))}
function pinta(){const l=filtra();
 if(vista==="mapa"){$("lista").innerHTML="";$("mapa").style.display="block";
  if(!map){map=L.map("mapa");L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);capa=L.layerGroup().addTo(map)}
  capa.clearLayers();const pts=l.filter(a=>a.lat&&a.lon);
  pts.forEach(a=>L.marker([a.lat,a.lon]).addTo(capa).bindPopup(`<b>${eur(a.precio)}</b><br>${esc(a.zona)}<br><a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir anuncio</a>`));
  map.setView([38.2,-0.65],9);if(pts.length)map.fitBounds(pts.map(a=>[a.lat,a.lon]),{padding:[30,30]});setTimeout(()=>map.invalidateSize(),50);return}
 $("mapa").style.display="none";
 $("lista").innerHTML=l.length?l.map(a=>`<article class="c"><div class="top"><span class="p">${eur(a.precio)}</span><span class="t">${esc(a.fuente)}</span></div>
 <div>${esc(a.titulo)}</div><div class="t">${esc(a.zona)} · ${a.m2||"?"} m² · ${a.hab||"?"} hab · ${a.banos||"?"} baños</div>
 <div class="tags">${tags(a)}</div>
 <div class="act"><a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir anuncio</a>
 <button data-f="${a.id}">${S.fav.includes(a.id)?"Quitar favorito":"Favorito"}</button>
 <button data-d="${a.id}">${S.desc.includes(a.id)?"Recuperar":"Descartar"}</button></div></article>`).join("")
 :'<div class="vacio">No hay anuncios con estos filtros. El buscador revisa los portales cada pocas horas.</div>'}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.v){vista=b.dataset.v;document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x===b))}
 const t=(k,id)=>{const i=S[k].indexOf(id);i<0?S[k].push(id):S[k].splice(i,1);guarda()};
 if(b.dataset.f)t("fav",b.dataset.f);if(b.dataset.d)t("desc",b.dataset.d);pinta()});
["zona","orden","rg"].forEach(i=>$(i).addEventListener("change",pinta));
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{A=Object.values(d.anuncios||{});
 [...new Set(A.map(a=>a.zona))].sort().forEach(z=>$("zona").add(new Option(z,z)));
 $("sub").textContent=`${A.length} anuncios · actualizado ${d.actualizado?new Date(d.actualizado).toLocaleString("es-ES"):"aún no"}`;pinta()})
 .catch(()=>{$("sub").textContent="No se pudo cargar data.json";pinta()});
</script>
</body>
</html>
